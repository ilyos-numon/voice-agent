[project]
name = "voice-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]
[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "playwright>=1.45", "ruff>=0.5", "mypy>=1.10"]
tts = ["supertonic>=1.3.1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
[build-system]  # uv가 패키지로 다루도록 최소 백엔드. app/ 을 import 가능하게 한다
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
