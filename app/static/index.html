<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>voice-agent demo</title>
</head>
<body>
  <h1>🎤 말씀하세요 (지금은 글자로 입력)</h1>
  <input type="text" id="question" value="">
  <button id="ask">묻기</button>
  <section id="result" data-state="idle">
    <p id="transcript"></p>
    <p id="answer"></p>
    <p id="source"></p>
    <p id="timings"></p>
    <audio id="audio" controls></audio>
  </section>
  <p id="error" hidden></p>
</body>
</html>
